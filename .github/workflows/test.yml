name: Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
      # insight: skip ONNX native embedding load in CI (binding dlopen can
      # fail on runners and surfaces as unhandled rejection -> exit 1)
      EMMS_DISABLE_EMBEDDINGS: '1'

    steps:
    - uses: actions/checkout@v5

    # Corepack must be enabled before setup-node: its package-manager cache
    # probe runs `yarn cache dir`, which fails on the runner's global
    # Yarn 1.x while package.json pins yarn@4.6.0.
    - name: Enable Corepack
      run: corepack enable

    - name: Use Node.js
      uses: actions/setup-node@v5
      with:
        node-version: '20'

    - name: Set Yarn Version
      run: corepack prepare yarn@4.6.0 --activate

    - name: Install dependencies
      run: yarn install --immutable

    - name: Build all workspaces
      run: yarn build

    - name: Test all workspaces
      run: yarn test
