name: Publish npm

# Release-Pfad: develop → main merge (oder Push auf main) publiziert beide
# Server auf npmjs.com — aber NUR wenn sich die Package-Version geändert hat
# (Guard gegen doppelte Versionen). Bei unveränderter Version skippt der Job.
#
# Auth: Trusted Publishing (OIDC) — einmalig auf npmjs.com PRO Package
# konfigurieren (Package-Seite → Settings → "Publishing access" →
# Trusted Publisher):
#   Organization/user : paschbaer
#   Repository        : thinking-mcp
#   Workflow filename : publish-npm.yml
#   Environment       : (leer lassen)
# Danach authentifiziert sich `npm publish --provenance` in diesem Workflow
# tokenlos über den GitHub-Actions-OIDC-Token (id-token: write, unten
# gesetzt; benötigt npm ≥ 11.5 → daher Node 24). Kein NPM_TOKEN-Secret nötig.
# Fallback, falls du stattdessen ein Token nutzen willst: im Publish-Step
# wieder `env: NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}` ergänzen — beachte
# aber, dass 2FA-Bypass-Tokens ab ~2027 nur noch gestagte Publishes
# erlauben (GitHub-Changelog 2026-07-08).

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish ${{ matrix.scope }} to npmjs.com
    runs-on: ubuntu-latest
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: '0'
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: server-clear-thought
            scope: clear-thought
          - package: server-stochasticthinking
            scope: stochasticthinking
    steps:
      - uses: actions/checkout@v5

      - name: Enable Corepack
        run: corepack enable

      - uses: actions/setup-node@v5
        with:
          # npm >= 11.5 benötigt (OIDC Trusted Publishing)
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Build workspace
        run: yarn workspace @paschbaer/${{ matrix.scope }} build

      - name: Publish only when the version changed
        id: guard
        working-directory: servers/${{ matrix.package }}
        run: |
          LOCAL=$(node -p "require('./package.json').version")
          REMOTE=$(npm view "@paschbaer/${{ matrix.scope }}" version 2>/dev/null || echo "none")
          if [ "$LOCAL" = "$REMOTE" ]; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi
          echo "local=$LOCAL remote=$REMOTE publish=$(grep -o 'true\|false' "$GITHUB_OUTPUT" | tail -1)"

      - name: Publish to npmjs.com (OIDC — tokenlos)
        if: steps.guard.outputs.publish == 'true'
        working-directory: servers/${{ matrix.package }}
        run: npm publish --provenance --access public
