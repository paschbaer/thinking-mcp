# Local override: use the Thinking-MCP repository itself as Guidance default
# workspace so lifecycle gates (lint/test/build) run against the real project.
# Host node_modules stays untouched: the named volume shadows /workspace/node_modules
# with a container-internal install (needed only if you want in-container tests).
#
# specs/008 multi-workspace: all mounts use RELATIVE paths (resolved against
# this compose file's directory, servers/server-guidance/):
#   ../../    → the Thinking-MCP repository (default workspace)
#   ../../../ → the repos pool (D:/repos on this machine) — additional
#               workspaces are registered in .guidance/guidance.json
#               workspaces[] with container paths like /workspaces/<Repo>.
# No absolute host paths in this file — relocate the checkout and only these
# two relative mounts need to keep working.
services:
  guidance:
    extra_hosts:
      # resolves host.docker.internal on Linux hosts too (Docker Desktop has it built in)
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../:/workspace
      - ../../../:/workspaces
      - guidance_node_modules:/workspace/node_modules
    environment:
      - GUIDANCE_WORKSPACE_ROOT=/workspace

volumes:
  guidance_node_modules:
