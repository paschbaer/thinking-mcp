# Local override: serve the repos pool. specs/014: the instance .guidance at
# the workspace root is REGISTRY-ONLY (workspaces[]); each repo carries its
# own process config in <root>/.guidance.
#
# All mounts use RELATIVE paths (resolved against this compose file's
# directory, servers/server-guidance/):
#   ../../    → the Thinking-MCP repository (mounted at /workspace, reachable
#               via the workspaces[] entry "thinking-mcp")
#   ../../../ → the repos pool (D:/repos on this machine) = the served
#               workspace root; additional workspaces are registered in
#               /workspaces/.guidance/guidance.json with paths /workspaces/<Repo>.
# No absolute host paths in this file — relocate the checkout and only these
# two relative mounts need to keep working.
services:
  guidance:
    extra_hosts:
      # resolves host.docker.internal on Linux hosts too (Docker Desktop has it built in)
      - "host.docker.internal:host-gateway"
    volumes:
      - ../../:/workspace
      - ../../../:/workspaces
      - guidance_node_modules:/workspace/node_modules
    environment:
      - GUIDANCE_WORKSPACE_ROOT=/workspaces

volumes:
  guidance_node_modules:
