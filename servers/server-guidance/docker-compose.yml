
services:
  guidance:
    build: .
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
      # Container port-mapping requires 0.0.0.0 inside the container
      # (explicit operator opt-in; local runs default to loopback, FR-027).
      - GUIDANCE_BIND_HOST=0.0.0.0
      # Workspace: .guidance/ (config + state) lives OUTSIDE the container
      # (host bind mount) so sessions, snapshots and audit survive re-deploys
      # and are directly backupable from ./workspace on the host.
      - GUIDANCE_WORKSPACE_ROOT=/workspace
      # Optional: set to require `Authorization: Bearer <token>` on /mcp.
      # - GUIDANCE_AUTH_TOKEN=change-me
    volumes:
      # Host-Verzeichnis muss für UID 1000 (node) beschreibbar sein:
      #   mkdir -p ./workspace && sudo chown 1000:1000 ./workspace
      - ./workspace:/workspace
      # Optional (spec 005 FR-405 / TRACK-Venv-C): Python-venv außerhalb des
      # Workspace-Mounts persistieren (Named Volume + Env unten) — vermeidet
      # Linux-Binaries auf Windows-Host-Mounts:
      # - guidance-venvs:/venvs
    # Optional dazu:
    # environment:
    #   - UV_PROJECT_ENVIRONMENT=/venvs/myproject
# volumes:
#   guidance-venvs:
    healthcheck:
      # healthy erst wenn konfiguriert (/health liefert "configured": true)
      test: ["CMD-SHELL", "curl -f http://localhost:3003/health | grep -q '\"configured\":true'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
