
services:
  guidance:
    build: .
    ports:
      - "3003:3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
      # Container port-mapping requires 0.0.0.0 inside the container
      # (explicit operator opt-in; local runs default to loopback, FR-027).
      - GUIDANCE_BIND_HOST=0.0.0.0
      # Workspace root: set by your deployment override (specs/014 — e.g.
      # the repos pool at /workspaces; see docker-compose.override.yml).
      # No default workspace mount here: specs/014 instances are
      # registry-only and compose per-workspace configs from <root>/.guidance.
      # Optional: set to require `Authorization: Bearer <token>` on /mcp.
      # - GUIDANCE_AUTH_TOKEN=change-me
    # Volumes are provided by your deployment override (specs/014 — e.g. the
    # repos pool at /workspaces; see docker-compose.override.yml). Nothing is
    # mounted by the base file. Optional additions (single-repo deployments):
    # Optional (spec 005 FR-405 / TRACK-Venv-C): Python-venv außerhalb des
    # Workspace-Mounts persistieren (Named Volume + Env unten) — vermeidet
    # Linux-Binaries auf Windows-Host-Mounts:
    # volumes:
    #   - guidance-venvs:/venvs
      # Optional (Rust): Cargo-Build-Artefakte außerhalb des Workspace-Mounts
      # persistieren — deutlich schnellere Builds und keine Linux-Binaries im
      # Host-Mount:
      # - guidance-targets:/targets
      # Optional (C#): NuGet-Cache außerhalb des Workspace-Mounts persistieren:
      # - guidance-nugets:/nugets
    # Optional dazu:
    # environment:
    #   - UV_PROJECT_ENVIRONMENT=/venvs/myproject
    #   - CARGO_TARGET_DIR=/targets/myproject
    #   - NUGET_PACKAGES=/nugets/myproject
# volumes:
#   guidance-venvs:
#   guidance-targets:
#   guidance-nugets:
    healthcheck:
      # healthy erst wenn konfiguriert (/health liefert "configured": true)
      test: ["CMD-SHELL", "curl -f http://localhost:3003/health | grep -q '\"configured\":true'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
