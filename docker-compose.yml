# Root-level orchestration: runs all MCP servers as Docker containers
# (clear-thought, insight, guidance, plus the GitNexus analysis stack:
# gitnexus-server and gitnexus-web).
# The VS Code MCP config (User mcp.json) points at
#   - http://localhost:3000/mcp  (clear-thought)
#   - http://localhost:3002/mcp  (insight)
#   - http://localhost:3003/mcp  (guidance)
# Start everything with:  docker compose up -d --build
#
# Per-server composes live in servers/server-*/docker-compose.yml.

services:
  clear-thought:
    build: ./servers/server-clear-thought
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      # Required for container port-mapping (servers default to loopback)
      - CLEAR_THOUGHT_BIND_HOST=0.0.0.0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  insight:
    build: ./servers/server-insight
    ports:
      - "127.0.0.1:3002:3002"
    environment:
      - NODE_ENV=production
      - PORT=3002
      # Required for container port-mapping (server defaults to loopback)
      - EMMS_BIND_HOST=0.0.0.0
      # CB-20: optional bearer auth — set on the host to require
      # `Authorization: Bearer <token>` on /mcp (empty = auth off,
      # loopback-only binding is then the only protection).
      - EMMS_AUTH_TOKEN=${EMMS_AUTH_TOKEN:-}
      # Store + artifacts live OUTSIDE the container (host bind mount) so they
      # survive re-deploys, `docker compose down -v`, and are directly
      # backupable from ./servers/server-insight/emms-data on the host
      - EMMS_STORAGE_PATH=/usr/src/app/data/emms-store.db
    volumes:
      - ./servers/server-insight/emms-data:/usr/src/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  gitnexus-server:
    # Compose-managed replacement of the former standalone gitnexus-server
    # container (GN migration, 2026-10-08). Full pool mount — same as the
    # guidance service — so in-repo .gitnexus indexes written by in-container
    # `docker compose exec gitnexus-server gitnexus analyze` are served
    # directly. The registry persists on the host pool root
    # (D:/repos/.gitnexus-home) instead of an anonymous Docker volume.
    image: ghcr.io/abhigyanpatwari/gitnexus:latest
    # Wrap the image CMD: safe.directory must live in the GLOBAL gitconfig
    # (git ignores it via env/local config by design) so the analyzer's git
    # calls work on the root-owned Windows bind mount. '*' is scoped to this
    # disposable analysis container (it only ever sees /workspaces).
    command: sh -c "git config --global --add safe.directory '*' && git config --global --add safe.directory /workspaces && exec gitnexus serve --host 0.0.0.0 --port \"$${PORT:-4747}\""
    ports:
      # 0.0.0.0 on purpose: the guidance container reaches this server via
      # host.docker.internal:4747 (host-gateway), which does NOT land on
      # loopback-only bindings. Same exposure as the former standalone
      # container. Tightening (compose-DNS + 127.0.0.1) is a tracked follow-up.
      - "4747:4747"
    environment:
      - NODE_ENV=production
      - PORT=4747
      # Registry location on the shared pool mount (survives compose down;
      # host-backupable, mirrors the emms-data pattern). Index storage itself
      # stays in-repo (<repo>/.gitnexus) via per-repo registration.
      - GITNEXUS_HOME=/workspaces/.gitnexus-home
      - GITNEXUS_NO_UPDATE_NOTIFIER=1
      - GITNEXUS_LBUG_MAX_DB_SIZE=17179869184
    volumes:
      - ../:/workspaces
    healthcheck:
      # Any HTTP response (including 405) proves the server is up.
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:4747/api/mcp').then(()=>process.exit(0)).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  gitnexus-web:
    # Web UI; GITNEXUS_BACKEND_URL stays empty — the browser connects to the
    # server URL directly (same wiring as the former standalone container).
    image: ghcr.io/abhigyanpatwari/gitnexus-web:latest
    ports:
      - "127.0.0.1:4173:4173"
    environment:
      - GITNEXUS_BACKEND_URL=
    restart: unless-stopped

  guidance:
    build: ./servers/server-guidance
    ports:
      - "127.0.0.1:3003:3003"
    environment:
      - NODE_ENV=production
      - PORT=3003
      # Container port-mapping requires 0.0.0.0 inside the container
      # (explicit operator opt-in; local runs default to loopback, FR-027).
      - GUIDANCE_BIND_HOST=0.0.0.0
      # Pool mode (specs/014): the instance .guidance at the workspace root
      # is REGISTRY-ONLY (workspaces[]); each repo carries its own process
      # config in <root>/.guidance. Additional workspaces are registered in
      # /workspaces/.guidance/guidance.json with paths /workspaces/<Repo>.
      - GUIDANCE_WORKSPACE_ROOT=/workspaces
    extra_hosts:
      # resolves host.docker.internal on Linux hosts too (Docker Desktop has it built in)
      - "host.docker.internal:host-gateway"
    volumes:
      # Repos pool: relative to THIS file (repo root) → ../ = D:/repos,
      # which includes the Thinking-MCP checkout itself
      # (/workspaces/Thinking-MCP). Keep in sync with
      # servers/server-guidance/docker-compose.override.yml — a wrong
      # resolution here (e.g. beyond the drive root) breaks the registered
      # workspace paths and/or the scaffold (EACCES).
      - ../:/workspaces
    healthcheck:
      # healthy erst wenn konfiguriert (/health liefert "configured": true)
      test: ["CMD-SHELL", 'curl -f http://localhost:3003/health | grep -q "\"configured\":true"']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped
